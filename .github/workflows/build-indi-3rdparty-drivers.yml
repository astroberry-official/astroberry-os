name: indi-3rdparty-drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, "${{ matrix.architecture }}"]

    strategy:
      fail-fast: false
      matrix:
        distro: ["debian-trixie"]
        architecture: ["arm64", "amd64"]

    container:
      image: ghcr.io/${{ github.repository }}/${{ matrix.distro }}-${{ matrix.architecture }}

    steps:
      - name: Get INDI 3rd Party Sources
        uses: actions/checkout@v6
        with:
          repository: 'indilib/indi-3rdparty'
          ref: refs/tags/v2.2.1.1
          path: 'indi-3rdparty'

      - name: Fix INDI 3rd Party Sources
        run: |
          for i in $(ls indi-3rdparty/debian/*/rules);do chmod 755 $i;done
          sed -i "s/^lib/usr\/lib/g" indi-3rdparty/debian/indi-*/*.install
          sed -i "s/\/lib\/udev\/rules.d/\/usr\/lib\/udev\/rules.d/g" indi-3rdparty/indi-openogma/CMakeLists.txt

      - name: Install INDI Core
        run: |
          dpkg -i build/indi-bin_*_${{ matrix.architecture }}.deb build/libindi1_*_${{ matrix.architecture }}.deb build/libindi-data_*_all.deb build/libindi-dev_*_${{ matrix.architecture }}.deb

      - name: Install INDI 3rd Party Libraries
        run: |
          dpkg -i --force-overwrite $(ls build/lib* | grep -v dbgsym | grep -v libindi | grep -v dev) && dpkg -i --force-overwrite $(ls build/lib* | grep -v dbgsym | grep -v libindi | grep dev)

      - name: Build INDI 3rd Party Drivers
        run: |
          mkdir -p build/deb_indi-3rdparty-drivers && \
          cp -r indi-3rdparty/debian/indi-3rdparty-drivers build/deb_indi-3rdparty-drivers/debian && \
          cp -r indi-3rdparty/cmake_modules build/deb_indi-3rdparty-drivers/ && \
          cp indi-3rdparty/CMakeLists.txt build/deb_indi-3rdparty-drivers/ && \
          cp -r indi-3rdparty/indi-* build/deb_indi-3rdparty-drivers/ && \          
          cd build/deb_indi-3rdparty-drivers && \
          fakeroot debian/rules binary
